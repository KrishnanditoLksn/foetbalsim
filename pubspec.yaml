name: futbol
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  drift: 2.23.1
  drift_flutter: 0.2.4
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  path: 1.9.1
  path_provider: 2.1.5
  sqlite3_flutter_libs: 0.5.30

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: 2.23.1
  build_runner: 2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/seed/spain.json
    - assets/icon/app_logo.png
  # Barlow (OFL, lihat assets/fonts/OFL.txt): teks biasa; Barlow Condensed
  # untuk angka, skor, dan nama klub (huruf punggung jersey).
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
